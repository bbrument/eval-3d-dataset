# Martine — evaluation config for the PUBLISHED dataset layout.
#
# Runs the eval pipeline directly on the released Martine dataset, without any
# copying, symlinking or path rewriting, keeping a strict split between the
# READ-ONLY dataset and a WRITABLE workspace:
#
#   DATASET (read-only)  <DATA>/<object>/mvs/d1/...                            <- reconstruction
#                        <DATA>/<object>/gt/{gt.ply,gt_pcd.npy,attributes/,
#                          challenges/,masks_eval/,masks_watertight/,
#                          eval_cameras.sfm}                                   <- evaluation kit
#
#   WORKSPACE (writable) <RUNS>/<object>/<method>/results_raw/mesh.{ply,obj}    <- your input
#                        <RUNS>/<object>/<method>/{results_cleaned,eval_results} <- outputs
#                                                                                <- eval_root
#
# Nothing is ever written under <DATA>. The exact published GT point cloud,
# attributes and challenge masks are consumed directly from the read-only kit.
#
# QUICK START
#   1. Edit the `paths:` block below: <DATA> = your download, <RUNS> = a scratch dir.
#   2. Drop each reconstruction at  <RUNS>/<object>/<method>/results_raw/mesh.ply
#   3. See eval/docs (or the dataset's docs/EVALUATION.md) for the command sequence.
#
# RESOLUTION: scoring always uses the full-resolution evaluation kit under gt/
# (masks_eval/ at 9568x6376 with eval_cameras.sfm), whatever tier (d1/d2/d4/d8) the
# reconstruction was computed from. Meshes must be in the dataset frame (mm).

dataset:
  name: "martine"
  # Published object names (folder names). `pillow` and `coin` are omitted:
  # they ship no Groundtruth mesh, so they cannot be scored.
  objects:
    - "bowl"
    - "can"
    - "candle"
    - "colander"
    - "glass"
    - "grid"
    - "hammer_head"
    - "jam_pot"
    - "knife"
    - "lego"
    - "moka_pot"
    - "paw_pad"
    - "petanque_ball"
    - "plant"
    - "plate"
    - "rock"
    - "sneakers"
    - "spikes_ball"
    - "spine"
    - "straw_hat"
    - "surgery_saw"
    - "surgery_scissors"
    - "vase"
    - "warrior_head"
    - "whisk"
    - "wood"
  # List the method folder name(s) you placed under each object, e.g. "colmap",
  # "neus2". Leave empty and use the watcher/auto-scan if you prefer discovery.
  methods:
    - "methodA"
  num_views: 84

paths:
  # ----- EDIT THESE: <DATA> = downloaded dataset (read-only), <RUNS> = workspace -----
  # data_root is retained for reconstruction-side compatibility. Evaluation uses
  # only the explicit inputs under gt/ below (masks_watertight/ ships with the
  # objects whose GT has holes, e.g. sneakers and wood; elsewhere it is skipped).
  # eval_root : workspace — your results_raw/ meshes and all eval outputs.
  #             MUST be separate from <DATA>.                                    [write]
  data_root: "/path/to/martine_dataset/{object}/mvs/d1"
  gt_root: "/path/to/martine_dataset/{object}/gt"
  gt_artifacts_root: "/path/to/martine_dataset/{object}/gt"
  eval_cameras: "/path/to/martine_dataset/{object}/gt/eval_cameras.sfm"
  eval_masks: "/path/to/martine_dataset/{object}/gt/masks_eval"
  watertight_masks: "/path/to/martine_dataset/{object}/gt/masks_watertight"
  eval_root: "/path/to/workspace/runs/{object}"

cleanup:
  # Carve reconstructed vertices that project outside every (dilated) silhouette.
  # Auto dilation: 48 px at full res (9568x6376), rescaled per mask resolution,
  # so the same value is correct at d1/d2/d4.
  dilation_radius: auto
  dilation_ref_px: 48
  dilation_ref_n_pixels: 61005568   # 9568 * 6376 (d1 full resolution)
  use_masks: true

evaluation:
  # Units are MESH UNITS = millimetres (Martine GT meshes are in mm).
  downsample_density: 0.05          # resample step (mm) for both GT and recon
  max_dist: 4.0                     # Chamfer/coverage cutoff (mm)
  curvature_radius: 2.0
  fscore_thresholds: [0.5, 1.0, 1.5, 2.0, 5.0]

visualization:
  auto_generate: false
  default_metrics:
    - accuracy
    - completeness
  default_views: [0, 20, 40, 60]
  crop: true
  crop_margin: 15
  colormaps:
    accuracy: viridis
    completeness: viridis
  max_dist: 4.0

# Default to local execution so the config runs anywhere out of the box.
# For a cluster, set mode: "slurm" and fill the account/partition (see the
# `slurm:` block, mirrored from config/martine_watcher.yaml).
execution:
  mode: "local"
  local:
    max_workers: 4
  # slurm:
  #   account: "m25115"
  #   partition: "mesonet"
  #   cleanup: { cpus: 16, mem_gb: 256, time: "06:00:00" }
  #   eval:    { cpus: 16, mem_gb: 256, time: "04:00:00" }
  #   viz:     { cpus: 4,  mem_gb: 128, time: "01:00:00" }
