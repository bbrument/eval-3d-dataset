# Martine: evaluation config for the PUBLISHED dataset layout.
#
# Runs the eval pipeline directly on the released Martine dataset, without any
# copying, symlinking or path rewriting, keeping a strict split between the
# READ-ONLY dataset and a WRITABLE workspace:
#
#   DATASET (read-only)  <DATA>/<object>/mvs/d1/...                            <- reconstruction
#                        <DATA>/<object>/gt/{gt.ply,gt_pcd.npy,attributes/,
#                          challenges/,masks_eval/,masks_watertight/,
#                          eval_cameras.sfm}                                   <- evaluation kit
#
#   WORKSPACE (writable) <RUNS>/<object>/<method>/results_raw/mesh.{ply,obj}    <- your input
#                        <RUNS>/<object>/<method>/{results_cleaned,eval_results} <- outputs
#                                                                                <- eval_root
#
# Nothing is ever written under <DATA>. The exact published GT point cloud,
# attributes and challenge masks are consumed directly from the read-only kit.
#
# GETTING STARTED
#   1. cp config/martine.yaml config/martine.local.yaml, then set dataset_root (and
#      eval_root if your workspace is not ./runs) in the `paths:` block below.
#   2. Drop each reconstruction at  <RUNS>/<object>/<method>/results_raw/mesh.ply
#   3. uv run eval-pipeline -c config/martine.local.yaml run -o <object> -m <method>
#      (README "Getting started", docs/pipeline.md).
#
# RESOLUTION: scoring always uses the full-resolution evaluation kit under gt/
# (masks_eval/ at 9568x6376 with eval_cameras.sfm), whatever tier (d1/d2/d4/d8) the
# reconstruction was computed from. Meshes must be in the dataset frame (mm).

dataset:
  name: "martine"
  # Published object names (folder names). `pillow` and `coin` are omitted:
  # they ship no Groundtruth mesh, so they cannot be scored.
  objects:
    - "bowl"
    - "can"
    - "candle"
    - "colander"
    - "glass"
    - "grid"
    - "hammer_head"
    - "jam_pot"
    - "knife"
    - "lego"
    - "moka_pot"
    - "paw_pad"
    - "petanque_ball"
    - "plant"
    - "plate"
    - "rock"
    - "sneakers"
    - "spikes_ball"
    - "spine"
    - "straw_hat"
    - "surgery_saw"
    - "surgery_scissors"
    - "vase"
    - "warrior_head"
    - "whisk"
    - "wood"
  # Method folder names under each object, e.g. "colmap", "neus2". Empty: give one with
  # `run -m <method>`; `aggregate` then uses every method evaluated on disk.
  methods: []
  num_views: 84

paths:
  # ----- EDIT THESE TWO -----
  # dataset_root: the downloaded dataset (read-only), one folder per object.
  # eval_root:    the workspace with your <object>/<method>/results_raw/mesh.ply and all
  #               eval outputs; MUST be separate from dataset_root. Relative paths are
  #               resolved from the directory you run eval-pipeline in.
  dataset_root: "/path/to/martine_dataset"
  eval_root: "runs/{object}"
  # The rest follows the published layout. data_root is kept for reconstruction-side
  # compatibility; evaluation uses only the inputs under gt/ (masks_watertight/ ships
  # with the objects whose GT has holes, e.g. sneakers and wood; elsewhere it is skipped).
  data_root: "{dataset_root}/{object}/mvs/d1"
  gt_root: "{dataset_root}/{object}/gt"
  gt_artifacts_root: "{dataset_root}/{object}/gt"
  eval_cameras: "{dataset_root}/{object}/gt/eval_cameras.sfm"
  eval_masks: "{dataset_root}/{object}/gt/masks_eval"
  watertight_masks: "{dataset_root}/{object}/gt/masks_watertight"

cleanup:
  # Carve reconstructed vertices that project outside every (dilated) silhouette.
  # Auto dilation: 48 px at full res (9568x6376), rescaled per mask resolution,
  # so the same value is correct at d1/d2/d4.
  dilation_radius: auto
  dilation_ref_px: 48
  dilation_ref_n_pixels: 61005568   # 9568 * 6376 (d1 full resolution)
  use_masks: true

evaluation:
  # Units are MESH UNITS = millimetres (Martine GT meshes are in mm).
  downsample_density: 0.05          # resample step (mm) for both GT and recon
  max_dist: 4.0                     # Chamfer/coverage cutoff (mm)
  curvature_radius: 1.0               # VCM curvature: ball radius r (mm)
  curvature_tube: 0.5                 # VCM curvature: tube thickness R (mm)
  curvature_max_edge: 0.15            # VCM curvature: GT edges split down to this length (mm) = non-CT GT density
  fscore_thresholds: [0.5, 1.0, 1.5, 2.0, 5.0]

aggregation:
  # High-curvature zone |k| > 0.75 mm^-1 (VCM, r = 1, R = 0.5); convex < 0
  curvature_thresholds: {concave: -0.75, convex: 0.75}

visualization:
  auto_generate: false
  default_metrics:
    - accuracy
    - completeness
  default_views: [0, 20, 40, 60]
  crop: true
  crop_margin: 15
  colormaps:
    accuracy: viridis
    completeness: viridis
  max_dist: 4.0

# Default to local execution so the config runs anywhere out of the box.
# For a cluster, set mode: "slurm" and fill the account/partition (see the
# commented `slurm:` block below, with the resources used for the paper).
execution:
  mode: "local"
  local:
    max_workers: 4
  # slurm:
  #   account: "<your_account>"
  #   partition: "<your_partition>"
  #   cleanup: { cpus: 16, mem_gb: 256, time: "06:00:00" }
  #   eval:    { cpus: 16, mem_gb: 256, time: "04:00:00" }
  #   viz:     { cpus: 4,  mem_gb: 128, time: "01:00:00" }
