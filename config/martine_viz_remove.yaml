# NeurIPS Dataset — Visualization with exclude_mode=remove
# Only for objects with significant excluded regions: 03, 07, 15, 22
dataset:
  name: "eccv_viz_remove"
  objects:
    - "03_hammer_head"
    - "07_glass"
    - "15_lego"
    - "22_surgery_drill"
  methods: []
  exclude_methods: ["gomvs"]
  num_views: 84

paths:
  data_root: "/home/babrument/dev/alicevision/dataset_temp/objects/{object}/08c_undisto_refin_pct90/mvs"
  eval_root: "/projects/m25115/eval_3d_datasets/eccv_dataset/eval/{object}"

cleanup:
  dilation_radius: 30
  use_masks: false

evaluation:
  downsample_density: 0.05
  max_dist: 4.0
  curvature_radius: 2.0
  fscore_thresholds: [0.5, 1.0, 1.5, 2.0, 5.0]

visualization:
  auto_generate: false
  default_metrics:
    - uniform
    - accuracy
    - completeness
  default_views: [0, 20, 40, 60]
  scale: 1.0
  crop: true
  crop_margin: 15
  colormaps:
    accuracy: viridis
    completeness: viridis
    visibility: viridis
    curvature: coolwarm
  max_dist: 4.0
  exclude_mode: remove

execution:
  mode: "slurm"
  slurm:
    account: "m25115"
    partition: "mesonet"
    cleanup:
      cpus: 16
      mem_gb: 256
      time: "06:00:00"
    eval:
      cpus: 16
      mem_gb: 256
      time: "04:00:00"
    viz:
      cpus: 4
      mem_gb: 128
      time: "01:00:00"
