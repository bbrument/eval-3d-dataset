# eval-pipeline — EvalMVX (Yang et al., arXiv 2602.24065), 25 objects, 20 views.
#
# Modelled on `config/skoltech3d.yaml` (same units issue) and `config/lucesmv.yaml`
# (same thresholds, objects of comparable size).
#
# ============================================================================
#  UNITS — THE MAIN TRAP OF THIS DATASET (measured, not assumed)
# ============================================================================
# The paper reports Chamfer distances "in mm", but the released meshes are NOT in mm.
#
# Measured on the 25 released `cameras_sphere.npz` and `mesh.obj`:
#   * `scale_mat_i` = identity for all 25 objects -> no scale factor is provided;
#   * maximum camera distance |C|max = 2.7272727 EXACTLY for all 25 objects
#     (relative std = 0.000 %) -> a normalisation, not physics;
#   * |C|min ranges from 2.107 (Dragon) to 2.643 (Bell);
#   * GT bounding-box diagonal: 0.711 (Knight) to 1.312 (Hugo), normalised units;
#   * |v|max of the GT mesh: 0.357 to 0.663.
#
# The factor to mm is not shipped anywhere. Estimate and derivation: the paper states an
# object-camera distance of 0.6–0.8 m; the measured |C| range is 2.107–2.727. Both ends give
#     0.60 m / 2.107 = 284.8 mm/unit      and      0.80 m / 2.727 = 293.3 mm/unit
# i.e. a factor consistent within ±1.5 % -> 289 mm/unit, which also argues for a GLOBAL
# factor (the same for all 25 objects) rather than a per-object one.
#
# Consequences:
#   1. `units_scale_to_mm` below is an ESTIMATE (±1.5 %), not data. A global scale error
#      affects all methods the same way, so relative comparisons hold; only absolute mm
#      values are uncertain. Do not put an absolute number next to the paper's Table 2
#      without confirming this factor with the authors.
#   2. As for Skoltech3D, the tree builder applies the factor (the pipeline does not read
#      `gt_units` yet). If the tree is built WITHOUT conversion, the thresholds below (in mm)
#      are 289x too large -> `max_dist: 5.0` would cover 1445 mm, i.e. NO filtering, without
#      crashing. Check the mesh diagonal in the tree before any campaign: it must be
#      ~205–379 mm, not ~0.7–1.3.
#   3. Once the factor is confirmed, only one constant changes here.
dataset:
  name: "evalmvx"

  gt_units: "normalized"        # neither mm nor m: normalised frame of cameras_sphere.npz
  units_scale_to_mm: 289.0      # ESTIMATED (±1.5 %), see the derivation above

  objects:
    - "Bell"
    - "Bird"
    - "BlackDog"
    - "Cambodia"
    - "Caw"
    - "Chess"
    - "Dragon"
    - "Duck"
    - "Face"
    - "Frog"
    - "Hugo"
    - "Knight"
    - "Monk1"
    - "Monk2"
    - "Monkey"
    - "Mummy"
    - "Owl1"
    - "Owl2"
    - "Pig"
    - "SilverDog"
    - "Snail"
    - "Sphinx"
    - "Swan"
    - "Tiger"
    - "Yoga"

  normals_priors: []            # empty list, NOT null (the loader fails otherwise)
  methods: []                   # auto-detected by the watcher
  num_views: 20

paths:
  data_root: "/path/to/evalmvx/data/{object}"
  eval_root: "/path/to/workspace/evalmvx/eval/{object}"

cleanup:
  dilation_radius: 12
  use_masks: true

evaluation:
  # In MILLIMETRES (i.e. AFTER the builder applied units_scale_to_mm).
  # Same values as `lucesmv.yaml`: EvalMVX objects (estimated diagonal 205–379 mm) are of
  # the same order as LUCES-MV ones, or slightly larger (Bowl: 155 mm) -> `max_dist=2.0`
  # (the DiLiGenT-MV value) would clip too much.
  downsample_density: 0.07
  max_dist: 5.0
  fscore_thresholds: [0.5, 1.0, 1.5, 2.0, 3.0, 5.0]

visualization:
  auto_generate: false
  default_metrics:
    - uniform
    - accuracy
    - completeness
  scale: 1.0
  crop: true
  crop_margin: 15
  colormaps:
    accuracy: jet
    completeness: jet
  max_dist: 3.0
  exclude_mode: none

execution:
  mode: "slurm"
  local:
    max_workers: 4
  slurm:
    account: "<your_account>"
    partition: "<your_partition>"

watcher:
  scan_interval_minutes: 15
  log_file: "/path/to/evalmvx/eval_watcher.log"
