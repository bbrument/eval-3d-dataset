# Example configuration — "martine" style dataset (millimetre meshes, 84 views).
#
# This is a TEMPLATE with relative paths. Copy it, edit the two paths under
# `paths:`, and pass it with `-c`. It is not used by any live run.
#
# Layout it expects (see README, "Input layout"):
#   <eval_root>/Groundtruth/gt_mesh.ply          ground-truth mesh
#   <eval_root>/<method>/results_raw/mesh.ply    one reconstruction per method
#   <data_root>/masks/*.png                      binary masks, one per view
#   <data_root>/sfm.json                         AliceVision cameras

dataset:
  name: "my_martine_like_dataset"
  objects:
    - "01_rock"
    - "24_warrior_head"
  methods:
    - "colmap_d2"
  num_views: 84

paths:
  # {object} is substituted per object. Relative paths resolve from the CWD.
  data_root: "./data/{object}/images"
  eval_root: "./eval/{object}"

cleanup:
  # Silhouette dilation, in PIXELS, applied to the masks before carving away
  # reconstructed vertices that project outside every silhouette. Larger =
  # more forgiving at the object border. 12 is the value used for the paper.
  dilation_radius: 12
  # Drop reconstructed points below this z (support plane). null = keep all.
  z_threshold: null

evaluation:
  # Point sampling step, in MESH UNITS (mm here). Both GT and reconstruction
  # are resampled to this density so the metric does not reward dense meshes.
  downsample_density: 0.05
  # Distances above this (MESH UNITS) are excluded from the Chamfer average.
  # It bounds the influence of gross outliers -- and `coverage` in the output
  # tells you what fraction of points survived it. See README.
  max_dist: 2.0
  # F-score thresholds, in MESH UNITS. Reported in `precision`/`recall`/`fscore`,
  # index-aligned with `thresholds` in metrics.json.
  fscore_thresholds: [0.5, 1.0, 1.5, 2.0, 5.0]

execution:
  mode: "local"
  local:
    max_workers: 4

aggregation:
  visibility_groups: null
  curvature_thresholds: null
