# Evaluation Pipeline Configuration for Skoltech3D Dataset
# =========================================================
# Parameters matching the original skoltech3d evaluation codebase.
# Note: Skoltech3D uses meters (not mm), hence the small density/threshold values.

dataset:
  name: "skoltech3d"
  objects:
    - "dragon"
    - "golden_snail"
    - "plush_bear"
    - "jin_chan"
    - "green_carved_pot"
    - "moon_pillow"
    - "painted_cup"
    - "red_ceramic_fish"
    - "painted_samovar"
    - "green_tea_boxes"
    - "blue_boxing_gloves"
    - "golden_bust"
    - "small_wooden_chessboard"
    - "amber_vase"
    - "green_bucket"
    - "white_human_skull"
    - "orange_mini_vacuum"
    - "pink_boot"
    - "skate"
    - "white_castle_land"
    - "wooden_trex"
  methods: []
  num_views: 100

paths:
  data_root: "/path/to/skoltech3d/data/{object}"
  eval_root: "/path/to/skoltech3d/eval/{object}"

cleanup:
  dilation_radius: 12
  use_masks: true

evaluation:
  downsample_density: 0.0001    # 0.1mm in meters
  max_dist: 0.01                # 10mm in meters
  fscore_thresholds: [0.001, 0.002, 0.003, 0.004, 0.005, 0.006, 0.007, 0.008, 0.009, 0.01]

visualization:
  auto_generate: false
  default_metrics:
    - uniform
    - accuracy
    - completeness
  scale: 1.0
  crop: true
  crop_margin: 15
  colormaps:
    accuracy: jet
    completeness: jet
  max_dist: 0.005
  exclude_mode: none

execution:
  mode: "local"
  local:
    max_workers: 4
