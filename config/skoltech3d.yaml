# eval-pipeline — Skoltech3D (wooden_trex and following).
#
# Published config: machine paths are placeholders. The real machine paths live
# in config/skoltech3d.local.yaml (git-ignored) — run with `-c config/skoltech3d.local.yaml`.
#
# Evaluation parameters modelled on `config/lucesmv.yaml` rather than `diligentmv.yaml`:
# Skoltech3D objects are large (wooden_trex GT diagonal = 434.9 mm vs ~150 mm for
# DiLiGenT-MV), so `max_dist=2.0` would clip a large share of the real errors.
dataset:
  name: "skoltech3d"

  # --- UNITS ----------------------------------------------------------------
  # eval-pipeline expresses `downsample_density`, `max_dist` and the F-score
  # thresholds IN THE MESH UNITS. DiLiGenT-MV and LUCES-MV are in millimetres;
  # Skoltech3D meshes (GT AND reconstructions) are in METRES. Without conversion,
  # `downsample_density: 0.07` would be a 70 mm step (a few dozen points for the
  # whole object) and `max_dist: 5.0` would be 5 metres, i.e. no filtering: the
  # metrics would be meaningless WITHOUT CRASHING. The native units are declared
  # here and the factor is applied when building the evaluation tree, so everything
  # downstream is in mm, as for the other datasets.
  #
  # `gt_units` is purely DECLARATIVE for the pipeline (it does not read it yet);
  # the tree builder applies `units_scale_to_mm`. When the pipeline handles units
  # itself, the key is already there.
  gt_units: "m"
  units_scale_to_mm: 1000.0

  objects: ["wooden_trex"]
  normals_priors: []          # empty list, NOT null (the loader fails otherwise)
  methods: []                 # auto-detected by the watcher
  num_views: 100

paths:
  data_root: "/path/to/skoltech3d/data/{object}"
  eval_root: "/path/to/workspace/skoltech3d/eval/{object}"

cleanup:
  dilation_radius: 12
  ray_offset_factor: 0.01
  z_threshold: null   # no absolute height cut for Skoltech3D (kept only for DiLiGenT-MV)

evaluation:
  # In MILLIMETRES (see units_scale_to_mm above)
  downsample_density: 0.07
  max_dist: 5.0
  fscore_thresholds: [0.25, 0.5, 1.0, 2.0, 3.0, 5.0]

execution:
  mode: "local"
  local:
    max_workers: 4

watcher:
  scan_interval_minutes: 15
  log_file: "/path/to/skoltech3d/eval_watcher.log"
