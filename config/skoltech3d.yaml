# eval-pipeline — Skoltech3D (wooden_trex et suivants).
#
# Published config: machine paths are placeholders. The real machine paths live
# in config/skoltech3d.local.yaml (git-ignored) — run with `-c config/skoltech3d.local.yaml`.
#
# Paramètres d'évaluation calqués sur `config/lucesmv.yaml` du eval_pipeline plutôt
# que sur `diligentmv.yaml` : les objets sk3d sont grands (diagonale GT du wooden_trex
# = 434,9 mm contre ~150 mm pour DiLiGenT-MV), donc `max_dist=2.0` écrêterait une
# grande part des erreurs réelles.
dataset:
  name: "skoltech3d"

  # --- UNITÉS ---------------------------------------------------------------
  # 🔴 eval-pipeline exprime `downsample_density`, `max_dist` et les seuils de
  # F-score DANS LES UNITÉS DU MESH. DiLiGenT-MV et LUCES-MV sont en millimètres ;
  # les meshes sk3d (GT ET reconstructions) sont en MÈTRES. Sans conversion,
  # `downsample_density: 0.07` vaudrait un pas de 70 mm (une vingtaine de points
  # pour tout l'objet) et `max_dist: 5.0` vaudrait 5 mètres, donc aucun filtrage :
  # les métriques seraient absurdes SANS PLANTER. On déclare donc les unités
  # natives ici, et `scripts/sk3d_trex/s15_build_eval_tree_mm.py` applique le
  # facteur à la construction de l'arbre -> tout est en mm en aval, comme les
  # autres datasets, et les chiffres sont comparables aux tables du papier.
  #
  # `gt_units` est purement DÉCLARATIF pour le pipeline (il ne le lit pas encore) ;
  # c'est le builder d'arbre qui applique `units_scale_to_mm`. Le jour où le
  # pipeline gérera lui-même les unités, la clé est déjà là et fait foi.
  gt_units: "m"
  units_scale_to_mm: 1000.0

  objects: ["wooden_trex"]
  normals_priors: []          # ⚠ liste vide, PAS null (le loader plante sinon)
  methods: []                 # auto-détection par le watcher
  num_views: 100

paths:
  data_root: "/path/to/skoltech3d/data/{object}"
  eval_root: "/path/to/workspace/skoltech3d/eval/{object}"

cleanup:
  dilation_radius: 12
  ray_offset_factor: 0.01
  z_threshold: null   # no absolute height cut for Skoltech3D (kept only for DiLiGenT-MV)

evaluation:
  # ⚠ EN MILLIMÈTRES (cf. units_scale_to_mm ci-dessus)
  downsample_density: 0.07
  max_dist: 5.0
  fscore_thresholds: [0.25, 0.5, 1.0, 2.0, 3.0, 5.0]

execution:
  mode: "local"
  local:
    max_workers: 4

watcher:
  scan_interval_minutes: 15
  log_file: "/path/to/skoltech3d/eval_watcher.log"
