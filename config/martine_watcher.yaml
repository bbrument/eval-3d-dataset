# NeurIPS Dataset Watcher — auto-detect all methods, all objects, cleanup+eval+viz
# Uses scan_mode=auto (filesystem discovery, no methods list needed)
dataset:
  name: "martine_watcher"
  objects:
    - "01_rock"
    - "02_vase"
    - "03_hammer_head"
    - "04_candle"
    - "06_can"
    - "07_glass"
    - "08_boule"
    - "09_jam_pot"
    - "10_colander"
    - "11_ecorce"
    - "12_assiette"
    - "13_paw_pad"
    - "14_moka"
    - "15_lego"
    - "16_surgery_scissors"
    - "17_knife"
    - "18_spikes_ball"
    - "19_straw_bob"
    - "21_sneakers"
    - "22_surgery_drill"
    - "23_whisk"
    - "24_warrior_head"
    - "25_plant"
    - "26_grid"
    - "27_bowl"
    - "28_spine"
  methods: []
  exclude_methods: ["gomvs", "rvo-rnbneus2", "mvscps-tenlight-dir-pilF", "mvscps-tenlight-point-pilF", "__bak", "__rerun", "outofscope"]
  num_views: 84

paths:
  data_root: "/home/babrument/dev/alicevision/dataset_temp/objects/{object}/08c_undisto_refin_pct90/mvs"
  eval_root: "/projects/m25115/eval_3d_datasets/eccv_dataset/eval/{object}"

cleanup:
  # Resolution-adaptive dilation (48px @ full res 9568x6376, scaled per mask).
  # Apply masks during visibility filtering.
  dilation_radius: auto
  dilation_ref_px: 48
  dilation_ref_n_pixels: 61005568  # 9568 * 6376
  use_masks: true

evaluation:
  downsample_density: 0.05
  max_dist: 4.0
  curvature_radius: 2.0
  fscore_thresholds: [0.5, 1.0, 1.5, 2.0, 5.0]

visualization:
  auto_generate: true
  default_metrics:
    - uniform
    - accuracy
    - completeness
  default_views: [0, 20, 40, 60]
  scale: 1.0
  crop: true
  crop_margin: 15
  colormaps:
    accuracy: viridis
    completeness: viridis
    visibility: viridis
    curvature: coolwarm
  max_dist: 4.0

execution:
  mode: "local"
  slurm:
    account: "m25115"
    partition: "mesonet"
    cleanup:
      cpus: 16
      mem_gb: 256
      time: "06:00:00"
    eval:
      cpus: 16
      mem_gb: 256
      time: "04:00:00"
    viz:
      cpus: 4
      mem_gb: 128
      time: "01:00:00"
