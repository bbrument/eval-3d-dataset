# ECCV Dataset Evaluation — refined T2S variant (refin_pct90)
# Data root points to 09_unimsps_d{N}_refin_pct90/ which contains:
#   - sfm.json   : refined poses in GT metric space
#   - masks/     : refined DMR masks at downscale 2
# Mesh from RNb-NeuS2 is already in GT metric space (via refined cameras),
# so no extra transform is needed at eval time.
dataset:
  name: "eccv_dataset_refin"
  objects:
    - "01_rock"
    - "02_vase"
    - "03_hammer_head"
  methods:
    - "rnbneus2-unimsps-d2-refin_pct90"
  num_views: 84

paths:
  data_root: "/home/babrument/dev/alicevision/dataset_temp/objects/{object}/09_unimsps_d2_refin_pct90"
  eval_root: "/projects/m25115/eval_3d_datasets/eccv_dataset/eval/{object}"

cleanup:
  dilation_radius: 30
  z_threshold: null

evaluation:
  downsample_density: 0.05
  max_dist: 2.0
  fscore_thresholds:
    - 0.5
    - 1.0
    - 1.5
    - 2.0
    - 5.0
