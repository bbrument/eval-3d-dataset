# NeurIPS Dataset Evaluation Configuration
dataset:
  name: "eccv_dataset"
  objects:
    - "01_rock"
    - "02_vase"
    - "03_hammer_head"
    - "04_candle"
    - "06_can"
    - "07_glass"
    - "08_boule"
    - "09_jam_pot"
    - "10_colander"
    - "13_paw_pad"
  methods:
    - "rnbneus2-unimsps-d2"
  num_views: 84

paths:
  data_root: "/home/babrument/dev/alicevision/dataset_temp/objects/{object}/08c_undisto/mvps"
  eval_root: "/projects/m25115/eval_3d_datasets/eccv_dataset/eval/{object}"

cleanup:
  dilation_radius: 12
  z_threshold: null

evaluation:
  downsample_density: 0.05
  max_dist: 2.0
  fscore_thresholds:
    - 0.5
    - 1.0
    - 1.5
    - 2.0
    - 5.0
