# Example configuration — Skoltech3D (sk3d).
#
# This is a TEMPLATE with relative paths. Copy it, edit the two paths under
# `paths:`, and pass it with `-c`. It is not used by any live run.
#
# ---------------------------------------------------------------------------
# UNITS -- the one thing that silently ruins sk3d numbers
# ---------------------------------------------------------------------------
# `downsample_density`, `max_dist` and `fscore_thresholds` are expressed in the
# MESH's OWN UNITS. sk3d meshes (ground truth AND reconstructions) are in
# METRES, while DiLiGenT-MV / LUCES-MV style data is in MILLIMETRES.
#
# Left unconverted, `downsample_density: 0.07` would mean a 70 mm step (a few
# dozen points for the whole object) and `max_dist: 5.0` would mean 5 metres,
# i.e. no filtering at all. The metrics would be meaningless WITHOUT FAILING.
#
# So: convert the meshes to millimetres when building the eval tree, and keep
# the thresholds below in millimetres. `gt_units` / `units_scale_to_mm` are
# DECLARATIVE -- the pipeline does not apply them itself yet; they record what
# the source data was so the conversion is auditable.
dataset:
  name: "sk3d"
  gt_units: "m"
  units_scale_to_mm: 1000.0

  objects: ["wooden_trex"]
  normals_priors: []    # must be an empty list, NOT null -- the loader rejects null
  methods: []           # empty = discovered from disk
  num_views: 100

paths:
  data_root: "./data/{object}"
  eval_root: "./eval/{object}"

cleanup:
  dilation_radius: 12
  ray_offset_factor: 0.01
  z_threshold: 5

evaluation:
  # IN MILLIMETRES (see the units note above).
  # sk3d objects are large -- the wooden_trex GT diagonal is 434.9 mm against
  # ~150 mm for DiLiGenT-MV -- so max_dist is 5.0 here rather than 2.0: a
  # tighter bound would clip a large share of genuine error.
  downsample_density: 0.07
  max_dist: 5.0
  fscore_thresholds: [0.25, 0.5, 1.0, 2.0, 3.0, 5.0]

execution:
  mode: "local"
  local:
    max_workers: 4
